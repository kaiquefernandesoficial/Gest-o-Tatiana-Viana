<!DOCTYPE html>
<html lang="pt-BR" style="background:#000000;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Tatiana Viana | Moda Feminina</title>

  <!-- Cores: tudo preto -->
  <meta name="color-scheme" content="dark">

  <!-- PWA: Android/Chrome -->
  <link rel="manifest" href="manifest.json?v=2">
  <meta name="theme-color" content="#000000">
  <meta name="msapplication-navbutton-color" content="#000000">
  <meta name="msapplication-TileColor" content="#000000">

  <!-- PWA: iOS/Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tatiana Viana">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/favicon-64.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000000;
      color-scheme: dark;
      overflow: hidden;
    }

    #app-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000000;
      color-scheme: dark;
    }

    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease;
      z-index: 10;
    }

    #splash img {
      width: 160px;
      height: 160px;
      margin-bottom: 24px;
    }

    #splash .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(218, 182, 111, 0.25);
      border-top-color: #dab66f;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <iframe id="app-frame"
    src="https://script.google.com/macros/s/AKfycbxKr2PIAv-tPJjLA0p-UQ7dtnrhn8TX8UKKpgtB1lgmKIB-Z5o4S2q7r4nXd5hsD4hYlg/exec"
    title="Tatiana Viana - Moda Feminina"
    onload="document.getElementById('splash').classList.add('hidden')">
  </iframe>

  <div id="splash">
    <img src="icons/icon-192.png" alt="Tatiana Viana">
    <div class="spinner"></div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('service-worker.js');
      });
    }

    // Some browsers keep the splash if the iframe never fires "load"
    setTimeout(function () {
      document.getElementById('splash').classList.add('hidden');
    }, 6000);
  </script>

</body>
</html>
